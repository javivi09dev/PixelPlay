name: PixelPlayFolia
version: '${version}'
main: me.javivi.pixelplayfolia.PixelPlayFoliaPlugin
api-version: '1.21'
folia-supported: true
description: Server-side bridge for PixelPlay client mod (video, image, fade, audio)
author: Javivi
commands:
  pixelplay:
    description: PixelPlay media commands for clients with the mod
    usage: /<command> ...
    permission: pixelplay.admin
    aliases: [pp]

permissions:
  pixelplay.admin:
    description: Use PixelPlay commands
    default: op
